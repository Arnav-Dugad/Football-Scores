<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0e16" />
    <meta
      name="description"
      content="Football, beautifully in focus. Authentic scores, fixtures, season tables and result-based analytics for Europe's top leagues."
    />
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Football Scores — The beautiful game, in focus.</title>
    <script>
      try {
        const t = localStorage.getItem("fs-theme");
        document.documentElement.dataset.theme =
          t && t !== "system"
            ? t
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
